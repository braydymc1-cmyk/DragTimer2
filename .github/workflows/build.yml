              onNavigate: (AppScreen) -> Unit
          ) {
              val lockColor = when {
                  uiState.externalGnssActive -> Color(0xFF00E5FF)
                  uiState.satellitesUsed >= 10 && uiState.accuracyM <= 3.5f -> Color(0xFF00E676)
                  uiState.satellitesUsed >= 6 -> Color(0xFFFFC400)
                  else -> Color(0xFFFF5252)
              }
              Row(
