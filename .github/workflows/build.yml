                  val rowValPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.BLACK
                      typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                      textSize = 25f
                      textAlign = Paint.Align.RIGHT
                  }
                  val dashPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.GRAY
