                      drawRow("330 FT", sec(run.time330ftMs))
                      drawRow("1/8 MILE ET", sec(run.timeEighthMileMs))
                      drawRow("1/8 MILE SPEED", run.speedEighthMileKmh?.let { UnitConverter.formatSpeed(it, useMph) } ?: "---")
