name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Complete v2.0 Project Files
        run: |
          mkdir -p app/src/main/java/com/performance/gpstimer

          cat << 'EOF' | sed 's/^          //' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' | sed 's/^          //' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ApexTelemetry"
          include(":app")
          EOF

          cat << 'EOF' | sed 's/^          //' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
              id("com.google.devtools.ksp") version "2.0.0-1.0.21" apply false
          }
          EOF

          cat << 'EOF' | sed 's/^          //' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.performance.gpstimer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.performance.gpstimer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")
          }
          EOF

          cat << 'EOF' | sed 's/^          //' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
