                      gnssSourceType = GnssSourceType.entries.find { it.name == prefs.getString("gnssSourceType", GnssSourceType.INTERNAL_GPS.name) } ?: GnssSourceType.INTERNAL_GPS,
                      btObdAddress = prefs.getString("btObdAddress", "") ?: "",
